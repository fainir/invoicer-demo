<!doctype html>
<html lang="en" class="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invoicer</title>
  <meta name="description" content="One-click invoices for freelancers. Everything stays in your browser.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1f5f4a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5f4a'/%3E%3Cpath d='M9 8h14v3H9zm0 6h14v3H9zm0 6h9v3H9z' fill='%23f6f3ec'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="container app-header-inner">
      <a class="brand" href="#/invoices" aria-label="Invoicer home">
        <svg class="brand-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="6" fill="#1f5f4a"/><path d="M9 8h14v3H9zm0 6h14v3H9zm0 6h9v3H9z" fill="#f6f3ec"/></svg>
        <span>Invoicer</span>
      </a>
      <nav class="app-nav" aria-label="Main">
        <a href="#/invoices" data-nav="invoices">Invoices</a>
        <a href="#/settings" data-nav="settings">Settings</a>
        <a class="btn btn-primary btn-nav" href="#/new" data-nav="new">New invoice</a>
      </nav>
    </div>
  </header>

  <div id="banner" class="banner container" role="alert" tabindex="-1" hidden></div>

  <main id="main" class="container" tabindex="-1">
    <noscript><p class="notice">Invoicer needs JavaScript to run. Everything stays in your browser; there is no server.</p></noscript>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>Everything stays in this browser. Nothing is sent anywhere. <a href="privacy.html">Privacy</a> · <a href="https://github.com/fainir/invoicer-demo">Source</a></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Delete all data?</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button type="submit" value="cancel" class="btn btn-secondary" autofocus>Cancel</button>
        <button type="submit" value="confirm" id="confirm-ok" class="btn btn-danger-solid">Delete everything</button>
      </div>
    </form>
  </dialog>

  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
